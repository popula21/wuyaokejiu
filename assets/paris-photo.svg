<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A damaged archival photograph</title>
  <desc id="desc">A moody constructed image suggesting a river, a bridge, and a marked old photograph.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
