<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A restricted clinical file</title>
  <desc id="desc">A constructed image of a restricted clinical document with redactions and stamped markings.</desc>
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="5"/>
      <feColorMatrix type="saturate" values=".1"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues=".12 .34"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#191917"/>
  <rect x="170" y="54" width="860" height="652" rx="5" fill="#d7ceb8" filter="url(#paper)"/>
  <rect x="230" y="126" width="260" height="28" fill="#22221f"/>
  <rect x="230" y="176" width="570" height="18" fill="#686251"/>
  <rect x="230" y="218" width="720" height="18" fill="#817a66"/>
  <rect x="230" y="260" width="620" height="18" fill="#817a66"/>
  <rect x="230" y="326" width="520" height="22" fill="#22221f"/>
  <rect x="230" y="372" width="710" height="18" fill="#817a66"/>
  <rect x="230" y="414" width="640" height="18" fill="#817a66"/>
  <rect x="230" y="456" width="590" height="18" fill="#817a66"/>
  <rect x="230" y="528" width="375" height="26" fill="#22221f"/>
  <rect x="230" y="586" width="690" height="18" fill="#817a66"/>
  <g transform="translate(705 110) rotate(-8)">
    <rect x="0" y="0" width="270" height="92" fill="none" stroke="#741c21" stroke-width="8"/>
    <text x="29" y="58" font-family="Georgia, serif" font-size="34" fill="#741c21">RESTRICTED</text>
  </g>
  <text x="230" y="92" font-family="Georgia, serif" font-size="28" fill="#2d2a23">DRK / CLINICAL / INTERNAL</text>
  <text x="230" y="642" font-family="Georgia, serif" font-size="24" fill="#741c21">Subject S-17 / relative stimulus: strong</text>
</svg>
